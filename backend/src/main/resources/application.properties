spring.application.name=supermarket-inventory
server.port=8080

# Local development defaults to an embedded file database so the project runs
# without requiring a separately installed MySQL server. Use the mysql profile
# for a shared MySQL database.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/supermarket_inventory;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:supermarket-inventory-secret-key-that-is-long-enough-for-hs256-algorithm-2024}
jwt.expiration=86400000

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
